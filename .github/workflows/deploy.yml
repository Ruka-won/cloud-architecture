
# GitHub Actions에 표시될 워크플로우 이름
name: Cloud Architecture CI/CD

# main 브랜치에 Push가 발생하면 워크플로우 실행
on:
  push:
    branches:
      - main

jobs:
  # 1단계: 애플리케이션 빌드 및 Docker 이미지 생성
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # GitHub 저장소의 소스 코드를 가져옴
      - name: Checkout source code
        uses: actions/checkout@v4

      # Java 17 개발 환경 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      # AWS 인증 정보 설정
      # GitHub Secrets에 저장된 인증 정보를 사용
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Gradle을 사용하여 프로젝트 빌드 및 테스트 실행
      - name: Build and Test
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      # Docker Hub에 로그인
      # GitHub Secrets에 저장된 계정과 토큰 사용
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ARM64 아키텍처 빌드를 위한 QEMU 에뮬레이션 환경 설정
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # AMD64와 ARM64 두 가지 아키텍처의 Docker 이미지 생성 및 Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloud-architecture-api:latest

  # 2단계: EC2 서버에 Docker 이미지 배포
  deploy:
    # build-and-push 작업이 성공해야 실행
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # SSH를 통해 EC2에 접속하고 배포 명령 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Docker Hub에서 최신 이미지 다운로드
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cloud-architecture-api:latest

            # 기존 컨테이너 중지
            # 컨테이너가 없을 경우에도 다음 명령 실행
            docker stop cloud-architecture-container || true

            # 기존 컨테이너 삭제
            # 컨테이너가 없을 경우에도 다음 명령 실행
            docker rm cloud-architecture-container || true

            # 새로운 이미지로 컨테이너 실행
            docker run -d \
              --name cloud-architecture-container \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              ${{ secrets.DOCKERHUB_USERNAME }}/cloud-architecture-api:latest
